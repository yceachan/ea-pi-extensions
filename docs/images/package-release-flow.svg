<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="package-release-flow-title package-release-flow-desc" id="package-release-flow-root">
      <title id="package-release-flow-title">多包发版与首发交付流程</title>
      <desc id="package-release-flow-desc">窄纵向流程图展示准备验证、registry 基线选择、regular 多包发版或 initial 单包首发、每个 tag 的 publish 工作流，以及最终交付检查。</desc>
      <defs>
      <style>#package-release-flow-root { --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: rgba(45, 49, 66, .14);
      --node-rule: rgba(45, 49, 66, .28);
      --accent: #bf4520;
      --accent-tint: rgba(191, 69, 32, .08);
      --sans: system-ui, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "Noto Sans Mono CJK SC", "Noto Sans Mono", "SFMono-Regular", Consolas, monospace; }
      #package-release-flow-root { color: var(--ink); font-family: var(--sans); }
      #package-release-flow-root .diagram-container { width: 100%; max-width: 720px; overflow-x: auto; }
      @media print {
#package-release-flow-root .diagram-container { overflow-x: visible; }
}
      #package-release-flow-root text { font-family: var(--sans); }
      #package-release-flow-root .mono { font-family: var(--mono); }
      #package-release-flow-root .node-title { fill: var(--ink); font-size: 18px; font-weight: 650; }
      #package-release-flow-root .node-sub { fill: var(--muted); font-size: 15px; }
      #package-release-flow-root .node-tech { fill: var(--soft); font: 13px var(--mono); }
      #package-release-flow-root .decision-title { fill: var(--ink); font-size: 17px; font-weight: 650; }
      #package-release-flow-root .decision-sub { fill: var(--soft); font: 13px var(--mono); }
      #package-release-flow-root .branch-label { fill: var(--muted); font: 600 13px var(--mono); letter-spacing: .05em; }
      #package-release-flow-root .legend { fill: var(--soft); font: 13px var(--mono); letter-spacing: .04em; }</style>
        <pattern id="package-release-flow-dots" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="12" r="0.8" fill="#2d3142" fill-opacity=".10"/>
        </pattern>
        <marker id="package-release-flow-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/>
        </marker>
        <marker id="package-release-flow-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0, 9 3.5, 0 7" fill="#bf4520"/>
        </marker>
      </defs>

      <rect width="720" height="900" fill="#f5f5f5"/>
      <rect width="720" height="900" fill="url(#package-release-flow-dots)" opacity=".55"/>

      <!-- All connectors precede boxes. Each elbow is rounded and each branch uses a distinct port. -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M360 140 V170" marker-end="url(#package-release-flow-arrow)"/>
        <path d="M292 243 V270 Q292 278 284 278 H190 Q182 278 182 286 V330" marker-end="url(#package-release-flow-arrow)"/>
        <path d="M428 243 V270 Q428 278 436 278 H530 Q538 278 538 286 V330" marker-end="url(#package-release-flow-arrow)"/>
        <path d="M130 506 V532 Q130 540 138 540 H292 Q300 540 300 548 V560" marker-end="url(#package-release-flow-arrow)"/>
        <path d="M590 506 V532 Q590 540 582 540 H428 Q420 540 420 548 V560" marker-end="url(#package-release-flow-arrow)"/>
        <path d="M360 678 V748" stroke="#bf4520" stroke-width="1.8" marker-end="url(#package-release-flow-arrow-accent)"/>
      </g>

      <!-- Branch labels are separated from their connector strokes by paper masks. -->
      <g>
        <rect x="212" y="244" width="86" height="22" rx="4" fill="#f5f5f5"/>
        <text x="255" y="260" text-anchor="middle" class="branch-label">有 · REGULAR</text>
        <rect x="422" y="244" width="86" height="22" rx="4" fill="#f5f5f5"/>
        <text x="465" y="260" text-anchor="middle" class="branch-label">无 · INITIAL</text>
      </g>

      <!-- 1. Common preparation -->
      <g text-anchor="middle">
        <rect x="120" y="44" width="480" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".28"/>
        <text x="360" y="80" class="node-title">准备与验证</text>
        <text x="360" y="108" class="node-sub">clean checkout · changelog · frozen install</text>
        <text x="360" y="130" class="node-sub">typecheck · test</text>
      </g>

      <!-- 2. Registry baseline decision -->
      <g text-anchor="middle">
        <polygon points="360,170 500,218 360,266 220,218" fill="#bf4520" stroke="#bf4520" stroke-width="1.8" fill-opacity=".08"/>
        <text x="360" y="216" class="decision-title">已有 registry 基线？</text>
        <text x="360" y="238" class="decision-sub">选择发版路径</text>
      </g>

      <!-- 3–4. Two release paths -->
      <g>
        <rect x="28" y="330" width="308" height="176" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".28"/>
        <text x="52" y="360" class="branch-label">REGULAR</text>
        <text x="52" y="391" class="node-title">常规发版 · gbump</text>
        <text x="52" y="421" class="node-sub">已有基线；一个 release commit</text>
        <text x="52" y="445" class="node-sub">每包一个 tag · Git refs 原子推送</text>
        <text x="52" y="469" class="node-sub">npm 逐包执行</text>
        <text x="52" y="493" class="node-tech">A --minor · B --patch</text>

        <rect x="384" y="330" width="308" height="176" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".28"/>
        <text x="408" y="360" class="branch-label">INITIAL</text>
        <text x="408" y="391" class="node-title">首发 · gbump --initial</text>
        <text x="408" y="421" class="node-sub">采用 manifest 当前版本</text>
        <text x="408" y="445" class="node-sub">npm publish · 2FA 授权</text>
        <text x="408" y="469" class="node-sub">push branch / exact tag</text>
        <text x="408" y="493" class="node-sub">沿用源码提交作为 release 基线</text>
      </g>

      <!-- 5. One workflow per tag -->
      <g text-anchor="middle">
        <rect x="120" y="560" width="480" height="118" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".28"/>
        <text x="360" y="598" class="node-title">每个 tag → publish.yml</text>
        <text x="360" y="628" class="node-sub">校验 tag → 发布目标版本</text>
        <text x="360" y="652" class="node-sub">版本已存在：跳过上传 → 创建 Release</text>
      </g>

      <!-- 6. Delivery checks -->
      <g text-anchor="middle">
        <rect x="100" y="748" width="520" height="110" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.8" fill-opacity=".08"/>
        <text x="360" y="785" class="node-title">交付检查</text>
        <text x="360" y="815" class="node-sub">main CI · publish CI 全绿</text>
        <text x="360" y="839" class="node-sub">npm 版本与 tarball 可下载 · Release 页面可见</text>
      </g>

      <text x="360" y="886" text-anchor="middle" class="legend">GIT REFS 原子推送 · NPM 包逐包发布</text>
    </svg>
