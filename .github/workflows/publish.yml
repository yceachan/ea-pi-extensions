name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write   # gh release create (release page from tag)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # actions/setup-node v4.4.0 (pinned SHA, supply-chain hygiene)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Detect changed packages
        id: changed
        run: |
          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            dirs="$(ls -d packages/*/ | xargs -n1 basename | tr '\n' ' ')"
          else
            # Diff against HEAD^ (not HEAD): the release commit itself bumps
            # every package.json, so including it would make every package look
            # changed and defeat on-demand publishing (version holes).
            dirs="$(git diff --name-only "$prev"..HEAD^ -- packages/ \
              | sed -n 's|^packages/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')"
          fi
          # Multi-line values are rejected by GITHUB_OUTPUT ("Invalid format")
          # unless written with the heredoc delimiter — hence tr '\n' ' '.
          echo "changed=$dirs" >> "$GITHUB_OUTPUT"
      - name: Publish changed packages
        env:
          CHANGED: ${{ steps.changed.outputs.changed }}
        run: |
          for pkg in $CHANGED; do
            if [ -f "packages/$pkg/package.json" ]; then
              name="@yceachan/$pkg"
              ver="$(node -p "require('./packages/$pkg/package.json').version")"
              # Idempotent retry: skip versions already on the registry, so a
              # partially failed run can be safely re-run (rerun would
              # otherwise die with EPUBLISHCONFLICT on published packages).
              if npm view "$name@$ver" version >/dev/null 2>&1; then
                echo "skip $name@$ver (already published)"
                continue
              fi
              echo "Publishing $name@$ver"
              npm publish --workspace="$name" \
                --provenance --access public
            fi
          done
      # A plain tag push does not create a GitHub Release page — create it
      # here from the manual release notes (changelog/vX.Y.Z/log.md) so every
      # tag gets a page. Idempotent: a re-run with an existing release just
      # skips it, matching the publish loop above.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — skip"
            exit 0
          fi
          notes="changelog/$tag/log.md"
          args=(--title "$tag")
          if [ -f "$notes" ]; then
            # Relative links in the changelog are meaningless on a release
            # page — absolutize them against the tag.
            base="https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/packages/"
            sed "s|(packages/|(${base}|g" "$notes" > /tmp/release-notes.md
            args+=(--notes-file /tmp/release-notes.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "$tag" "${args[@]}"
