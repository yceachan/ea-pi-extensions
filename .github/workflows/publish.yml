name: publish

on:
  push:
    tags:
      # Per-package tags: <pkg>@<ver> (e.g. pi-gadget@0.3.0). Legacy
      # lockstep tags (v0.1.1, v0.1.2, v0.2.0) contain no '@' and no
      # longer trigger this workflow.
      - "*@*"
  # Dry-run entry: same validation pipeline, no npm publish / no Release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Package tag to dry-run, e.g. pi-gadget@0.3.0"
        required: false
      dry_run:
        description: "Dry run: validate + echo, skip npm publish and Release creation"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: write   # gh release create (release page from tag)

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # actions/setup-node v4.4.0 (pinned SHA, supply-chain hygiene)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      # The tag itself is the publish instruction: <pkg>@<ver> names the
      # package and the exact version. Anything inconsistent is a hard
      # failure BEFORE any publish.
      - name: Parse and validate tag
        id: parsed
        run: |
          tag="$TAG"
          if [ -z "$tag" ]; then
            echo "::error::no tag given (push a <pkg>@<ver> tag or pass one via workflow_dispatch)"
            exit 1
          fi
          case "$tag" in
            *@*) ;;
            *)
              echo "::error::'$tag' is not a package tag (expects <pkg>@<ver>)"
              exit 1
              ;;
          esac
          pkg="${tag%@*}"
          ver="${tag#*@}"
          echo "$pkg" | grep -qE '^[a-z0-9-]+$' || { echo "::error::bad package name '$pkg'"; exit 1; }
          echo "$ver" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad version '$ver'"; exit 1; }
          [ -f "packages/$pkg/package.json" ] || { echo "::error::unknown package '$pkg'"; exit 1; }
          actual="$(node -p "require('./packages/$pkg/package.json').version")"
          [ "$actual" = "$ver" ] || {
            echo "::error::tag version $ver does not match packages/$pkg/package.json version $actual"
            exit 1
          }
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Publish package
        env:
          PKG: ${{ steps.parsed.outputs.pkg }}
          VER: ${{ steps.parsed.outputs.ver }}
        run: |
          name="@yceachan/$PKG"
          # Idempotent retry: skip versions already on the registry, so a
          # partially failed run can be safely re-run.
          if npm view "$name@$VER" version >/dev/null 2>&1; then
            echo "skip $name@$VER (already published)"
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would publish: npm publish --workspace=\"$name\" --provenance --access public"
            exit 0
          fi
          echo "Publishing $name@$VER"
          npm publish --workspace="$name" \
            --provenance --access public

      # A plain tag push does not create a GitHub Release page — create it
      # here from the manual release notes (changelog/<pkg>/<tag>/log.md) so
      # every package tag gets a page. Idempotent: a re-run with an existing
      # release just skips it, matching the publish step above.
      - name: Create GitHub Release
        env:
          PKG: ${{ steps.parsed.outputs.pkg }}
          VER: ${{ steps.parsed.outputs.ver }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would create GitHub Release $tag (notes: changelog/$PKG/v$VER/log.md)"
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — skip"
            exit 0
          fi
          notes="changelog/$PKG/v$VER/log.md"
          args=(--title "$tag")
          if [ -f "$notes" ]; then
            # Relative links in the changelog are meaningless on a release
            # page — absolutize them against the tag.
            base="https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/packages/"
            sed "s|(packages/|(${base}|g" "$notes" > /tmp/release-notes.md
            args+=(--notes-file /tmp/release-notes.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "$tag" "${args[@]}"
