name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # actions/setup-node v4.4.0 (pinned SHA, supply-chain hygiene)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Detect changed packages
        id: changed
        run: |
          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            dirs="$(ls -d packages/*/ | xargs -n1 basename | tr '\n' ' ')"
          else
            # Diff against HEAD^ (not HEAD): the release commit itself bumps
            # every package.json, so including it would make every package look
            # changed and defeat on-demand publishing (version holes).
            dirs="$(git diff --name-only "$prev"..HEAD^ -- packages/ \
              | sed -n 's|^packages/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')"
          fi
          # Multi-line values are rejected by GITHUB_OUTPUT ("Invalid format")
          # unless written with the heredoc delimiter — hence tr '\n' ' '.
          echo "changed=$dirs" >> "$GITHUB_OUTPUT"
      - name: Publish changed packages
        env:
          CHANGED: ${{ steps.changed.outputs.changed }}
        run: |
          for pkg in $CHANGED; do
            if [ -f "packages/$pkg/package.json" ]; then
              name="@yceachan/$pkg"
              ver="$(node -p "require('./packages/$pkg/package.json').version")"
              # Idempotent retry: skip versions already on the registry, so a
              # partially failed run can be safely re-run (rerun would
              # otherwise die with EPUBLISHCONFLICT on published packages).
              if npm view "$name@$ver" version >/dev/null 2>&1; then
                echo "skip $name@$ver (already published)"
                continue
              fi
              echo "Publishing $name@$ver"
              npm publish --workspace="$name" \
                --provenance --access public
            fi
          done
